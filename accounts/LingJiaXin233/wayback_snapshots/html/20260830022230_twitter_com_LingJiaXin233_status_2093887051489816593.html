  董卓体若巨熊，尤畏酷暑。每逢三伏溽热，其腋下如开双泉，汗涌如浆。然此汗非比寻常，色如琥珀，黏若膏脂，竟隐隐透出西域麝香混着椒盐炙肉之异气。吕布为表忠贞，每日晨昏定省，必以舌尖亲拭义父双腋，美其名曰“承露”。
  <br/>
  初时吕布几欲作呕，然三日后忽觉丹田灼热，挥戟时臂力暴涨，方知此汗竟有激发血气之奇效。更诡者，董卓腋汗遇风则凝，吕布常将舔舐所得汗脂捏为弹丸，临阵时含于舌下。每逢厮杀至力竭，咬破蜡丸，汗液入喉即双目赤红如癫，所向披靡，故得“飞将”凶名。
